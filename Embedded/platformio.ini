; PlatformIO Project Configuration File
; ESP32 DevKit V1 - Autonomous Car Project
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor
; Clean: pio run -t clean

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default

; Build Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Upload Settings
upload_speed = 921600
upload_port = COM*

; Library Dependencies - All Required Sensors
lib_deps = 
    ; WiFi & HTTP (built-in, but explicit for clarity)
    ; ArduinoJson for JSON serialization
    bblanchon/ArduinoJson@^6.21.3
    
    ; Temperature Sensor (DS18B20)
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.12.0
    
    ; Voltage Sensor
    madhephaestus/ESP32AnalogRead@^3.0.0
    
    ; Current & Power Sensor (INA219)
    adafruit/Adafruit INA219@^2.2.0
    
    ; Accelerometer & Gyroscope (MPU6050)
    adafruit/Adafruit MPU6050@^2.2.3
    adafruit/Adafruit Unified Sensor@^1.1.9
    
    ; Ultrasonic Sensor (HC-SR04)
    tim-st/NewPing@^1.9.4
    
    ; TFT Display (ST7735S)
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    
    ; Encoder (if used)
    paulstoffregen/Encoder@^1.4.3

; Library Search Paths
lib_extra_dirs = 
    src

; Source Files
src_dir = src

; Build Options
build_unflags = 
    -std=gnu++11

build_src_flags = 
    -std=gnu++17
    -Wall
    -Wextra

; Debug Configuration (Optional - requires JTAG)
[env:esp32dev-debug]
extends = env:esp32dev
debug_tool = esp-prog
debug_init_break = tbreak setup

